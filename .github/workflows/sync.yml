name: Sync Fork
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh repo sync Koopy98/public-bugbounty-programs --source projectdiscovery/public-bugbounty-programs
